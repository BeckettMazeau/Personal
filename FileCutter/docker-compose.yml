

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - ~/Downloads:/downloads:ro # Scope host access to the user's Downloads directory only
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TARGET_DOWNLOADS_PATH=/downloads
      - LM_STUDIO_API_BASE=http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - NODE_ENV=development
